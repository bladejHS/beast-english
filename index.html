<style>
@font-face{font-family:'Saira';font-style:normal;font-display:swap;font-weight:100 900;font-stretch:50% 125%;src:url(fonts/saira-latin-wdth-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}

html,body{margin:0;background:#05060a;color:#f3f5fa}
/* THE FORGE, the Beast English cut (shared engine: splash/forge.js, yellow): embers, the sparks lock into the wolf,
   the impact, BEAST ENGLISH stamped in, the sparks blow out and the black fades to the app. Tap skips. */
#splash{position:fixed;inset:0;z-index:100;overflow:hidden;cursor:pointer;background:#05060a;color:#f3f5fa;animation:sp-guard 0s linear 9s forwards}
@keyframes sp-guard{to{visibility:hidden;pointer-events:none}}
#sp-cv{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.sp-vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(120% 90% at 50% 40%,transparent 40%,rgba(0,0,0,.75) 100%)}
.sp-flash{position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 50% 42%,#fff 0,#fff 5%,rgba(254,240,138,.85) 14%,rgba(250,204,21,.4) 32%,rgba(5,6,10,0) 56%);opacity:0}
.sp-cam{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;gap:clamp(18px,3.4vh,32px);--w:min(56vw,34vh,300px)}
.sp-stage{position:relative;width:var(--w);aspect-ratio:680/801}
.sp-halo{position:absolute;left:50%;top:50%;width:170%;aspect-ratio:1;margin:-85% 0 0 -85%;border-radius:50%;opacity:0;background:radial-gradient(closest-side,rgba(202,138,4,.34),rgba(202,138,4,.08) 55%,transparent 74%)}
.sp-emb{position:absolute;inset:0;opacity:0;transform:scale(1.1)}
.sp-emb img{display:block;width:100%;height:100%;filter:drop-shadow(0 0 1px rgba(254,240,138,.85)) drop-shadow(0 0 16px rgba(202,138,4,.55))}
.sp-id{display:grid;justify-items:center;gap:10px}
.sp-name{margin:0;font:900 extra-condensed clamp(40px,11.5vw,80px)/.9 'Saira','Arial Narrow',sans-serif;letter-spacing:.05em;margin-right:-.05em;text-transform:uppercase;white-space:nowrap}
.sp-name i{display:inline-block;font-style:normal;opacity:0}
.sp-name .b{color:#facc15}.sp-name .g{width:.28em}
.sp-rule{display:block;width:min(62vw,340px);height:2px;background:linear-gradient(90deg,transparent,#ca8a04 22%,#facc15 50%,#ca8a04 78%,transparent);transform:scaleX(0);opacity:0}
.sp-tag{margin:0;font:700 semi-condensed clamp(11px,3vw,13.5px)/1.2 'Saira',system-ui,sans-serif;letter-spacing:.26em;margin-right:-.26em;color:#d9cfa8;white-space:nowrap;opacity:0}
.sp-hit .sp-flash{animation:sp-flash .5s cubic-bezier(.16,1,.3,1) both}
.sp-hit .sp-emb{animation:sp-burn .55s cubic-bezier(.2,.8,.2,1) .05s forwards}
.sp-hit .sp-halo{animation:sp-in .7s ease-out .2s both}
.sp-hit .sp-name i{animation:sp-stamp .42s cubic-bezier(.2,1.4,.3,1) var(--d) forwards}
.sp-hit .sp-rule{animation:sp-rule .34s ease-out .78s forwards}
.sp-hit .sp-tag{animation:sp-in .4s ease-out .9s forwards}
.sp-calm .sp-emb,.sp-calm .sp-halo,.sp-calm .sp-name i,.sp-calm .sp-tag{opacity:1;transform:none}.sp-calm .sp-rule{opacity:1;transform:none}
#splash.sp-out{opacity:0;transition:opacity .4s ease;pointer-events:none}
@keyframes sp-flash{0%{opacity:0}8%{opacity:1}100%{opacity:0}}
@keyframes sp-burn{to{opacity:1;transform:none}}
@keyframes sp-in{to{opacity:1}}
@keyframes sp-rule{to{opacity:1;transform:none}}
@keyframes sp-stamp{0%{opacity:0;transform:scale(1.7);text-shadow:-10px 0 0 #facc15,10px 0 0 #e5102c}25%{opacity:1}60%{text-shadow:-3px 0 0 #facc15,3px 0 0 #e5102c}100%{opacity:1;transform:none;text-shadow:none}}
</style>

<body>
<div id="splash" aria-hidden="true">
  <div class="sp-vig"></div><canvas id="sp-cv"></canvas>
  <div class="sp-cam"><div class="sp-stage"><div class="sp-halo"></div><div class="sp-emb"><img src="splash/umbra.webp" alt="" width="680" height="801"></div></div>
    <div class="sp-id"><p class="sp-name"><i style="--d:0.160s">B</i><i style="--d:0.195s">E</i><i style="--d:0.230s">A</i><i style="--d:0.265s">S</i><i style="--d:0.300s">T</i><i class="g"></i><i class="b" style="--d:0.360s">E</i><i class="b" style="--d:0.395s">N</i><i class="b" style="--d:0.430s">G</i><i class="b" style="--d:0.465s">L</i><i class="b" style="--d:0.500s">I</i><i class="b" style="--d:0.535s">S</i><i class="b" style="--d:0.570s">H</i></p><i class="sp-rule"></i><p class="sp-tag">AUZI. ÎNȚELEGI. VORBEȘTI.</p></div></div>
  <div class="sp-flash"></div>
</div>
<div id="app"></div>
<nav id="nav" class="nav" aria-label="Navigare"></nav>
<div id="ov"></div>
<div id="toast" role="status" aria-live="polite"></div>
<script>
// The opening plays on the first run and after a new version (setting in Ghid); a reload in the same session skips it.
(function () {
  var sp = document.getElementById('splash'); if (!sp) return;
  var V = '2026-11-13', mode = 'auto', known = '', seen = false, forge = null;
  try { var st = JSON.parse(localStorage.getItem('beast-english:v1') || '{}'); mode = st.opening || 'auto'; known = localStorage.getItem('beast-english:opened-v') || ''; } catch (e) {}
  try { seen = sessionStorage.getItem('beast-english:opened') === '1'; sessionStorage.setItem('beast-english:opened', '1'); } catch (e) {}
  function drop() { if (forge) forge.destroy(); sp.remove(); }
  if (seen || mode === 'off') { drop(); return; }
  var calm = mode === 'short' || (mode === 'auto' && known === V) || matchMedia('(prefers-reduced-motion: reduce)').matches || !window.BeastForge;
  try { localStorage.setItem('beast-english:opened-v', V); } catch (e) {}
  function out() { if (forge) forge.burst(); sp.classList.add('sp-out'); setTimeout(drop, 450); }
  sp.addEventListener('click', out);
  if (calm) { sp.classList.add('sp-calm'); setTimeout(out, 700); return; }
  forge = window.BeastForge.create({ canvas: document.getElementById('sp-cv'), mark: 'splash/umbra.webp', stage: sp.querySelector('.sp-stage'), color: [202, 138, 4], hot: [250, 204, 21], count: 2400,
    onImpact: function () { sp.classList.add('sp-hit'); try { navigator.vibrate && navigator.vibrate(40); } catch (e) {} } });
  requestAnimationFrame(function () { forge.start(); });
  setTimeout(out, 2500);
})();
</script>
<script type="module" src="/src/main.ts"></script>
</body>
